<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 200px; color: #202523; }
.phone { left: 820px; top: 90px; width: 380px; height: 820px; background:#f7f7f2; color:#202523; padding: 32px 26px; border-radius: 46px; }

.mic { margin: 30px auto 0; width: 150px; height: 150px; border-radius: 50%; background:#335aeb; box-shadow: 0 0 0 22px rgba(51,90,235,.14), 0 0 0 44px rgba(51,90,235,.07); }
.chat { margin-top: 56px; display:grid; gap: 10px; }
.chat div { font-size: 16px; padding: 12px 14px; border-radius: 16px; background:#e9ece5; line-height: 1.5; }
.chat div.r { background:#202523; color:#eef0e9; margin-left: 40px; }
.rec { left: 1250px; top: 330px; width: 290px; background:#202523; color:#eef0e9; padding: 26px; }
.rec small { font-size:13px; letter-spacing:2px; color:#9aa39a; }
.rec div { margin-top: 14px; display:flex; justify-content:space-between; font-size: 18px; }
.rec div b { font-weight:500; color:#d9eba7; }
</style></head>
<body><div class="art tone-paper">
<span class="caption">케어헬퍼 / App</span>
<div class="panel phone"><small>HEALTH CHECK</small><h4>대화로 기록하는<br>건강 체크</h4><div class="mic"></div>
<div class="chat"><div>“허리가 좀 쑤셔서 잠을 설쳤어”</div><div class="r">통증 · 수면 항목으로 정리</div></div></div>
<div class="panel rec"><small>RECORD</small><div>혈압<b>기록</b></div><div>혈당<b>기록</b></div><div>통증<b>기록</b></div><div>PDF 리포트<b>생성</b></div></div>
<div class="word">Care<span class="blue">.</span></div>
</div></body></html>
