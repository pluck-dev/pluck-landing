<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 230px; color: #374730; letter-spacing: -0.07em; font-variant-numeric: tabular-nums; }
.word small { display: block; font-size: 30px; letter-spacing: 3px; margin-bottom: 18px; font-weight: 500; }
.sheet { left: 700px; top: 110px; width: 830px; height: 780px; background: #f3f6fa; color: #172334; padding: 46px 48px; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; }
.stamp { font-family: "Geist Mono", monospace; font-size: 16px; letter-spacing: 2px; border: 2px solid #172334; border-radius: 30px; padding: 8px 16px; }
.date { font-size: 17px; color: #5d6b80; }
.sheet h2 { font-size: 44px; font-weight: 650; letter-spacing: -1.4px; margin-top: 34px; }
.sum { display: flex; gap: 12px; margin-top: 22px; }
.sum span { font-size: 16px; border-radius: 20px; padding: 7px 14px; background: #e3e9f2; color: #33445c; }
.sum .new { background: #335aeb; color: #fff; }
.rows { margin-top: 34px; display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 20px; background: #fff; border-radius: 18px; padding: 20px 22px; box-shadow: 0 10px 30px -24px rgba(23,35,52,.5); }
.d { font-family: "Geist Mono", monospace; font-size: 20px; font-weight: 500; text-align: center; border-radius: 12px; padding: 10px 0; }
.d1 { background: #ffe1df; color: #c0362c; } .d7 { background: #fff0cc; color: #9a6400; } .d22 { background: #e9edf3; color: #4a5a70; }
.t b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.4px; } .t span { display: block; margin-top: 6px; height: 9px; width: 70%; background: #e3e9f2; border-radius: 5px; }
.chip { font-size: 15px; border-radius: 20px; padding: 6px 12px; white-space: nowrap; }
.c-new { background: #eef1fd; color: #335aeb; } .c-chg { background: #fff0cc; color: #9a6400; } .c-same { border: 1.5px solid #c9d2de; color: #5d6b80; } .c-fail { border: 1.5px dashed #c0362c; color: #c0362c; }
.diff { position: absolute; right: 48px; bottom: 40px; font-family: "Geist Mono", monospace; font-size: 15px; color: #5d6b80; }
</style></head>
<body><div class="art tone-lime">
<span class="caption">공모전 모니터 / AI &amp; Automation</span>
<div class="panel sheet">
  <div class="sheet-top"><span class="stamp">09:00 KST</span><span class="date">매일 아침 · 자동 리포트</span></div>
  <h2>개발·AI 공모전 모니터</h2>
  <div class="sum"><span class="new">신규 1</span><span>마감 변경 0</span><span>D-7 진입 1</span><span>조회 실패 1</span></div>
  <div class="rows">
    <div class="row"><span class="d d1">D-1</span><span class="t"><b>AI 아이디어 공모전</b><span></span></span><span class="chip c-same">변경 없음</span></div>
    <div class="row"><span class="d d7">D-7</span><span class="t"><b>공공데이터 해커톤</b><span style="width:55%"></span></span><span class="chip c-chg">마감 변경</span></div>
    <div class="row"><span class="d d22">D-22</span><span class="t"><b>AI 콘텐츠 챌린지</b><span style="width:62%"></span></span><span class="chip c-new">신규</span></div>
    <div class="row"><span class="d d22">D-30</span><span class="t"><b>지역문제 해결 공모</b><span style="width:48%"></span></span><span class="chip c-fail">조회 실패</span></div>
  </div>
  <span class="diff">Δ 전일 리포트 대비</span>
</div>
<div class="word"><small>EVERY MORNING</small>09:00</div>
</div></body></html>
