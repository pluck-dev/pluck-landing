<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 210px; color: #374730; }
.calc { left: 640px; top: 120px; width: 560px; background:#f7f7f2; color:#202523; padding: 32px; }
.calc h4 { font-size: 24px; letter-spacing:-0.5px; }
.line { display:grid; grid-template-columns: 150px 1fr; gap: 16px; align-items:center; margin-top: 18px; font-size: 17px; }
.bar { height: 14px; border-radius: 7px; background:#e3e7de; overflow:hidden; } .bar i { display:block; height:100%; border-radius:7px; background:#7b7f78; }
.line.m .bar i { background:#9cbf3a; }
.verdict { margin-top: 26px; display:flex; gap: 10px; }
.verdict span { font-size:15px; padding:8px 14px; border-radius: 20px; border:1.5px solid #d0d6c9; }
.verdict .on { background:#202523; color:#f7f7f2; border-color:#202523; }
.src { left: 1240px; top: 470px; width: 300px; background:#202523; color:#eef0e9; padding: 26px; }
.src small { font-size:13px; letter-spacing:2px; color:#9aa39a; }
.src div { margin-top: 12px; font-size: 18px; display:flex; justify-content:space-between; }
.src div b { font-weight:500; color:#d9eba7; }
</style></head>
<body><div class="art tone-lime">
<span class="caption">셀러 소싱 분석 / AI & Automation</span>
<div class="panel calc"><h4>마진 계산</h4>
<div class="line"><span>소싱 원가</span><span class="bar"><i style="width:42%"></i></span></div>
<div class="line"><span>환율·배송비</span><span class="bar"><i style="width:18%"></i></span></div>
<div class="line"><span>관세</span><span class="bar"><i style="width:9%"></i></span></div>
<div class="line"><span>판매 수수료</span><span class="bar"><i style="width:14%"></i></span></div>
<div class="line m"><span>예상 마진</span><span class="bar"><i style="width:30%"></i></span></div>
<div class="verdict"><span class="on">진입 추천</span><span>보류</span><span>제외</span></div></div>
<div class="panel src"><small>CRAWLERS</small><div>쿠팡<b>수집</b></div><div>테무<b>수집</b></div><div>알리익스프레스<b>수집</b></div><div>1688<b>수집</b></div></div>
