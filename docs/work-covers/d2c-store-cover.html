<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 220px; color: #f7f7f2; }
.shop { left: 620px; top: 110px; width: 620px; height: 560px; background: #f7f7f2; color:#202523; padding: 32px; }
.shop h4 { font-size: 24px; letter-spacing: -0.5px; }
.fit { display:flex; gap:10px; margin-top:16px; }
.fit span { font-size:15px; padding:8px 14px; border-radius:20px; border:1.5px solid #d0d6c9; }

.grid { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin-top:22px; }
.card { border-radius:18px; background:#e9ece5; height:170px; position:relative; overflow:hidden; }
.card::after { content:""; position:absolute; left:18%; right:18%; top:38%; height:22%; border-radius: 40px 40px 8px 8px; background:#202523; opacity:.85; }
.card.b::after { background:#335aeb; top:45%; height:12%; left:10%; right:10%; border-radius:6px; }
.card.c::after { background:#7b7f78; transform: skewX(-18deg); }
.card i { position:absolute; left:12px; bottom:12px; width:60%; height:10px; border-radius:5px; background:#c8cdc1; }
.admin { left: 1150px; top: 560px; width: 390px; background: #1f292c; color:#eef0e9; padding: 26px; }
.admin small { font-size:13px; letter-spacing:2px; color:#9aa39a; }
.flow { display:grid; gap:10px; margin-top:14px; }
.flow div { display:flex; justify-content:space-between; font-size:17px; padding:12px 14px; border-radius:12px; background:#2f3632; }
.flow b { font-weight:500; color:#d9eba7; }
</style></head>
