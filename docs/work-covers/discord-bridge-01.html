<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
h1 { position: absolute; left: 72px; top: 130px; font-size: 76px; font-weight: 480; letter-spacing: -0.055em; line-height: 1.08; }
.cols { position: absolute; left: 72px; right: 72px; top: 400px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.col { background: #f7f7f2; border-radius: 26px; padding: 40px 38px 44px; min-height: 470px; box-shadow: 0 40px 80px -50px rgba(23,39,61,.35); display: flex; flex-direction: column; }
.col small { font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 2px; color: #6b7668; }
.col h2 { font-size: 38px; font-weight: 550; letter-spacing: -1px; margin-top: 22px; }
.col p { font-size: 21px; line-height: 1.65; color: #4f5a4c; margin-top: 16px; }
.cmd { margin-top: auto; font-family: "Geist Mono", monospace; font-size: 22px; background: #202523; color: #eef0e9; border-radius: 14px; padding: 18px 22px; }
.cmd b { color: #8fa4ff; font-weight: 500; }
.col.hi { background: #234dda; color: #d9e5ff; }
.col.hi small, .col.hi p { color: #c4d3ff; }
.col.hi .cmd { background: #1a3cb0; }
</style></head>
<body><div class="art tone-paper">
<span class="caption">Three command paths</span>
<h1>메시지 하나로,<br>세 가지 길<span class="blue">.</span></h1>
<div class="cols">
  <div class="col"><small>01 / AMBIENT</small><h2>일반 대화</h2><p>접두어 없는 메시지는 Codex 프롬프트가 되어 채널 세션에서 이어집니다.</p><div class="cmd">이 버그 고쳐줘</div></div>
  <div class="col hi"><small>02 / SHELL</small><h2>! 명령</h2><p>느낌표로 시작하면 PowerShell로 그대로 실행합니다. <b>!codex</b>는 실제 CLI입니다.</p><div class="cmd"><b>!</b>npm run build</div></div>
  <div class="col"><small>03 / SLASH</small><h2>슬래시 명령</h2><p>이미지·파일 첨부와 함께 묻거나, 작업 폴더를 바꾸고 세션을 초기화합니다.</p><div class="cmd"><b>/codex</b> image: 화면.png</div></div>
</div>
</div></body></html>
