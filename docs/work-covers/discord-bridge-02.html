<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>

.sess { justify-self: end; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 1px; color: #5c6948; border: 2px solid #b9c98f; border-radius: 30px; padding: 8px 16px; }
