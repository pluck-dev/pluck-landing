<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 220px; color: #f7f7f2; }
.phone { left: 860px; top: 90px; width: 380px; height: 820px; background: #f7f3ea; color: #202523; padding: 34px 28px; border-radius: 48px; }
.phone small { font-size: 14px; letter-spacing: 2px; color: #7b7f78; }
.phone h4 { font-size: 30px; margin-top: 10px; letter-spacing: -0.8px; line-height: 1.2; }
.book { margin-top: 26px; height: 300px; border-radius: 24px; background: linear-gradient(160deg,#335aeb,#1c2f8f); position: relative; overflow: hidden; }
.book::before { content:""; position:absolute; width:180px; height:180px; border-radius:50%; background:#f3d65a; right:-30px; top:-30px; opacity:.9; }
.book::after { content:""; position:absolute; left:0; right:0; bottom:0; height:110px; background:#2a3f9f; border-radius: 60% 60% 0 0; }
.wave { display:flex; gap:6px; align-items:center; height:70px; margin-top:26px; }
.wave i { flex:1; background:#335aeb; border-radius:4px; }
.ctrl { display:flex; justify-content:center; gap:26px; margin-top:22px; align-items:center; }
.ctrl span { width:54px; height:54px; border-radius:50%; border:2px solid #d0d3cc; }
.ctrl .play { width:78px; height:78px; background:#202523; border:0; }
.voice { left: 1290px; top: 360px; width: 250px; background: #f7f7f2; color:#202523; padding: 24px; }
.voice small { font-size: 13px; letter-spacing: 2px; color:#7b7f78; }
.voice b { display:block; font-size: 20px; margin-top:8px; }
.rec { margin-top:16px; width:64px; height:64px; border-radius:50%; background:#e0794b; box-shadow:0 0 0 12px rgba(224,121,75,.2); }
</style></head>
<body><div class="art tone-blue">
<span class="caption">Lulla / Client work · App</span>
<div class="panel phone"><small>TONIGHT</small><h4>엄마 목소리로<br>듣는 동화</h4><div class="book"></div>
<div class="wave"><i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:35%"></i><i style="height:65%"></i><i style="height:40%"></i><i style="height:75%"></i><i style="height:50%"></i><i style="height:25%"></i></div>
<div class="ctrl"><span></span><span class="play"></span><span></span></div></div>
<div class="panel voice"><small>VOICE CLONE</small><b>짧게 녹음하면<br>내 목소리로</b><div class="rec"></div></div>
<div class="word">룰라<span style="color:#f3d65a">.</span></div>
</div></body></html>
