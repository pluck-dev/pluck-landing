<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 110px; font-size: 240px; color: #d9e5ff; }
.r1 { width: 760px; height: 760px; right: -120px; top: 120px; }
.phone { left: 900px; top: 100px; width: 370px; height: 800px; background: #1f292c; color:#eef0e9; padding: 32px 26px; border-radius: 46px; }
.phone small { font-size: 13px; letter-spacing: 2px; color:#9aa39a; }
.phone h4 { font-size: 28px; margin-top: 8px; letter-spacing: -0.6px; }
.pillars { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin-top:22px; }
.pillars div { border-radius:14px; background:#2f3632; height:120px; display:grid; place-items:center; font-size:30px; }
.pillars div:nth-child(2) { background:#335aeb; }
.tiles { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px; }
.tiles div { border-radius:16px; padding:16px; background:#2f3632; font-size:17px; height:96px; }
.tiles div b { display:block; font-size:12px; letter-spacing:2px; color:#9aa39a; font-weight:500; margin-bottom:6px; }
.card { left: 1300px; top: 300px; width: 180px; height: 300px; border-radius: 20px; background: linear-gradient(170deg,#f3d65a,#e0794b); transform: rotate(8deg); }
.card::after { content:""; position:absolute; inset:16px; border:2px solid rgba(32,37,35,.5); border-radius:12px; }
</style></head>
<body><div class="art tone-blue">
<span class="caption">OMEN / App</span>
<div class="rings r1"></div>
<div class="panel card"></div>
<div class="panel phone"><small>TODAY</small><h4>오늘의 흐름</h4>
<div class="pillars"><div>甲</div><div>子</div><div>丙</div><div>午</div></div>
<div class="tiles"><div><b>SAJU</b>사주</div><div><b>TAROT</b>타로</div><div><b>ASTRO</b>점성술</div><div><b>PALM</b>손금·관상</div></div></div>
<div class="word">Omen<span style="color:#f3d65a">.</span></div>
</div></body></html>
