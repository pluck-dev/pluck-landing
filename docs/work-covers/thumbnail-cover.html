<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.word { position: absolute; left: 72px; bottom: 120px; font-size: 150px; color: #d9e5ff; }
.word em { font-style: normal; color: #fff; }
.grid { position: absolute; left: 760px; top: 120px; width: 770px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.t { position: relative; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 70px -40px rgba(0,0,30,.6); }
.t .badge { position: absolute; left: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-weight: 700; font-size: 20px; z-index: 3; box-shadow: 0 0 0 2px #111; }
.t h3 { position: absolute; left: 22px; bottom: 20px; font-size: 40px; line-height: .95; font-weight: 800; letter-spacing: -1.5px; z-index: 2; text-transform: uppercase; }
.sil { position: absolute; right: -10px; bottom: -20px; width: 150px; height: 190px; z-index: 1; }
.sil::before { content: ""; position: absolute; left: 40px; top: 0; width: 76px; height: 76px; border-radius: 50%; background: currentColor; }
.sil::after { content: ""; position: absolute; left: 0; top: 84px; width: 156px; height: 140px; border-radius: 80px 80px 0 0; background: currentColor; }
.a { background: #111; color: #ff2d2d; } .a h3 { color: #fff; } .a h3 b { color: #FFD700; }
.b { background: #FFD700; color: #111; } .b h3 { color: #111; }
.c { background: #fff; color: #00BFFF; } .c h3 { color: #111; } .c h3 b { color: #ff2d2d; }
.d { background: #ff2d2d; color: #111; } .d h3 { color: #fff; }
.picked { outline: 6px solid #fff; outline-offset: 6px; }
.tag { position: absolute; right: 14px; top: 14px; z-index: 3; font-size: 14px; font-weight: 600; letter-spacing: 1px; background: #fff; color: #234dda; border-radius: 20px; padding: 6px 12px; }
.cmd { position: absolute; left: 760px; top: 640px; font-family: "Geist Mono", monospace; font-size: 22px; color: #d9e5ff; background: #1a3cb0; border-radius: 14px; padding: 16px 22px; }
.cmd b { color: #fff; font-weight: 500; }
.rings { width: 700px; height: 700px; left: -220px; top: -260px; }
</style></head>
<body><div class="art tone-blue">
<span class="caption">YouTube 썸네일 생성기 / AI &amp; Automation</span>
<span class="rings"></span>
<div class="grid">
  <div class="t a"><span class="badge">A</span><h3>3분이면<br><b>끝</b></h3><span class="sil"></span></div>
  <div class="t b picked"><span class="badge">B</span><span class="tag">PICK</span><h3>이거 모르면<br>손해</h3><span class="sil"></span></div>
  <div class="t c"><span class="badge">C</span><h3>진짜 <b>원인</b>은<br>따로 있다</h3><span class="sil"></span></div>
  <div class="t d"><span class="badge">D</span><h3>전부<br>바뀝니다</h3><span class="sil"></span></div>
</div>
<div class="cmd"><b>/thumbnail</b> "주제" → 4 concepts</div>
<div class="word">Four ideas,<br><em>one click.</em></div>
</div></body></html>
